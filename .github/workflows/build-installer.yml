name: Build Phantom Installer

on:
  push:
    branches: [main]
    paths:
      - "Phantom.cfg"
      - "assets/**"
      - "installer/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

concurrency:
  group: phantom-installer-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify embedded resources
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/welcome.jpeg")) { throw "Missing assets/welcome.jpeg" }
          if (-not (Test-Path "assets/installing.png")) { throw "Missing assets/installing.png" }
          if (-not (Test-Path "assets/installed.png")) { throw "Missing assets/installed.png" }
          if (-not (Test-Path "Phantom.cfg")) { throw "Missing Phantom.cfg" }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create EXE icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open('assets/welcome.jpeg').convert('RGBA'); im.thumbnail((512,512)); im.save('installer/Phantom.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          dotnet restore installer/PhantomInstaller.csproj
          dotnet build installer/PhantomInstaller.csproj -c Release --no-restore
          dotnet publish installer/PhantomInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/PhantomInstaller.exe release/PhantomInstaller.exe -Force

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "release/PhantomInstaller.exe")) { throw "PhantomInstaller.exe was not produced" }
          $size = (Get-Item "release/PhantomInstaller.exe").Length
          if ($size -lt 1000000) { throw "Installer is unexpectedly small" }
          $hash = (Get-FileHash "release/PhantomInstaller.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Standalone installer size: $size bytes"
          Write-Host "SHA256: $hash"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomInstaller-v1.2.0
          path: release/PhantomInstaller.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.0"
          $notes = @"
          Phantom Installer v1.2.0

          - Adds an offline Pro Presets library for donk, m0NESY, ZywOo, s1mple, NiKo, ropz, XANTARES, device, sh1ro and b1t.
          - Presets include public snapshot values for sensitivity, zoom sensitivity, crosshair and viewmodel.
          - DPI, eDPI, resolution, aspect ratio, scaling and published FPS caps are shown as reference instead of being forced onto different hardware.
          - A pro preset can be overlaid onto the CFG Builder while preserving the user's other local settings and binds.
          - A pro preset can also be signed, saved to Downloads and installed into CS2 in one click.
          - The finished screen automatically generates the matching +exec Phantom-<player>.cfg command.
          - Existing multi-drive Steam/CS2 discovery, hardware optimization, CFG signatures and custom CFG installation remain included.
          - One standalone PhantomInstaller.exe; no extra folder is required.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main --title "Phantom Installer v1.2.0" --notes $notes
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Phantom Installer v1.2.0" --notes $notes
          }
          gh release upload $tag "release/PhantomInstaller.exe" --repo $env:GITHUB_REPOSITORY --clobber
