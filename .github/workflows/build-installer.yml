name: Build Phantom Installer

on:
  push:
    branches: [main]
    paths:
      - "Phantom.cfg"
      - "assets/**"
      - "installer/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

concurrency:
  group: phantom-installer-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify embedded resources
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/welcome.jpeg")) { throw "Missing assets/welcome.jpeg" }
          if (-not (Test-Path "assets/installing.png")) { throw "Missing assets/installing.png" }
          if (-not (Test-Path "assets/installed.png")) { throw "Missing assets/installed.png" }
          if (-not (Test-Path "Phantom.cfg")) { throw "Missing Phantom.cfg" }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create EXE icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open('assets/welcome.jpeg').convert('RGBA'); im.thumbnail((512,512)); im.save('installer/Phantom.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          dotnet restore installer/PhantomInstaller.csproj
          dotnet build installer/PhantomInstaller.csproj -c Release --no-restore
          dotnet publish installer/PhantomInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/PhantomInstaller.exe release/PhantomInstaller.exe -Force

      - name: Startup smoke test
        shell: pwsh
        run: |
          $dll = Get-ChildItem "installer/bin/Release" -Recurse -Filter "PhantomInstaller.dll" | Select-Object -First 1
          if ($null -eq $dll) { throw "Framework build DLL not found for startup smoke test" }
          $env:PHANTOM_STARTUP_SMOKE = "1"
          & dotnet $dll.FullName
          $exit = $LASTEXITCODE
          Remove-Item Env:PHANTOM_STARTUP_SMOKE -ErrorAction SilentlyContinue
          if ($exit -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "PhantomInstaller/startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Phantom Installer startup smoke test failed with exit code $exit"
          }
          Write-Host "Startup smoke test passed"

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "release/PhantomInstaller.exe")) { throw "PhantomInstaller.exe was not produced" }
          $size = (Get-Item "release/PhantomInstaller.exe").Length
          if ($size -lt 1000000) { throw "Installer is unexpectedly small" }
          $hash = (Get-FileHash "release/PhantomInstaller.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Standalone installer size: $size bytes"
          Write-Host "SHA256: $hash"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomInstaller-v1.2.1
          path: release/PhantomInstaller.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.1"
          $notes = @"
          Phantom Installer v1.2.1

          - Fixes the silent-startup failure path reported after v1.2.0.
          - Startup is now explicit and protected by global WPF exception handling.
          - Fatal startup errors are shown to the user instead of disappearing silently.
          - A diagnostic log is written to %LOCALAPPDATA%\PhantomInstaller\startup.log if startup fails.
          - CI now runs a real WPF startup smoke test before a release is published.
          - Keeps the Pro Presets library for donk, m0NESY, ZywOo, s1mple, NiKo, ropz, XANTARES, device, sh1ro and b1t.
          - Existing CFG Builder, hardware optimization, multi-drive CS2 discovery, signatures and custom CFG installation remain included.
          - One standalone PhantomInstaller.exe; no extra folder is required.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main --title "Phantom Installer v1.2.1" --notes $notes
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Phantom Installer v1.2.1" --notes $notes
          }
          gh release upload $tag "release/PhantomInstaller.exe" --repo $env:GITHUB_REPOSITORY --clobber
