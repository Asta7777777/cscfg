name: Build Phantom Installer

on:
  push:
    branches: [main]
    paths:
      - "Phantom.cfg"
      - "assets/**"
      - "installer/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create EXE icon from welcome artwork
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open('assets/welcome.jpeg').convert('RGBA'); im.thumbnail((512,512)); im.save('installer/Phantom.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build single-file installer
        shell: pwsh
        run: |
          dotnet publish installer/PhantomInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/PhantomInstaller.exe release/PhantomInstaller.exe -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomInstaller
          path: release/PhantomInstaller.exe
          if-no-files-found: error

      - name: Commit latest EXE to repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/PhantomInstaller.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: update PhantomInstaller.exe [skip ci]"
            git push
          } else {
            Write-Host "Installer binary is already current."
          }
