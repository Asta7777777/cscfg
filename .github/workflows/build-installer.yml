name: Build Phantom Installer

on:
  push:
    branches: [main]
    paths:
      - "Phantom.cfg"
      - "assets/**"
      - "installer/**"
      - "README.md"
      - "LICENSE"
      - "SECURITY.md"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

concurrency:
  group: phantom-installer-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify embedded resources
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/welcome.jpeg")) { throw "Missing assets/welcome.jpeg" }
          if (-not (Test-Path "assets/installing.png")) { throw "Missing assets/installing.png" }
          if (-not (Test-Path "assets/installed.png")) { throw "Missing assets/installed.png" }
          if (-not (Test-Path "Phantom.cfg")) { throw "Missing Phantom.cfg" }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create EXE icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; im=Image.open('assets/welcome.jpeg').convert('RGBA'); im.thumbnail((512,512)); im.save('installer/Phantom.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          dotnet restore installer/PhantomInstaller.csproj
          dotnet build installer/PhantomInstaller.csproj -c Release --no-restore
          dotnet publish installer/PhantomInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/PhantomInstaller.exe release/PhantomInstaller.exe -Force

      - name: Verify truly standalone output
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/PhantomInstaller.exe")) { throw "PhantomInstaller.exe was not produced" }
          $companions = @(Get-ChildItem "publish" -File | Where-Object { $_.Name -ne "PhantomInstaller.exe" })
          if ($companions.Count -ne 0) {
            $names = ($companions | ForEach-Object Name) -join ", "
            throw "Publish is not standalone; companion files remain: $names"
          }

      - name: Test the exact release EXE in isolation
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "phantom-release-probe"
          New-Item -ItemType Directory -Force $probeDir | Out-Null
          $probeExe = Join-Path $probeDir "PhantomInstaller.exe"
          Copy-Item "release/PhantomInstaller.exe" $probeExe -Force
          $env:PHANTOM_STARTUP_SMOKE = "1"
          try {
            $process = Start-Process -FilePath $probeExe -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Release EXE startup test timed out"
            }
            if ($process.ExitCode -ne 0) {
              $log = Join-Path $env:LOCALAPPDATA "PhantomInstaller/startup.log"
              if (Test-Path $log) { Get-Content $log }
              throw "Release EXE startup test failed with exit code $($process.ExitCode)"
            }
          }
          finally {
            Remove-Item Env:PHANTOM_STARTUP_SMOKE -ErrorAction SilentlyContinue
          }
          Write-Host "Exact release EXE startup test passed"

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          $size = (Get-Item "release/PhantomInstaller.exe").Length
          if ($size -lt 1000000) { throw "Installer is unexpectedly small" }
          $hash = (Get-FileHash "release/PhantomInstaller.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Standalone installer size: $size bytes"
          Write-Host "SHA256: $hash"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomInstaller-v1.2.2
          path: release/PhantomInstaller.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.2.2"
          $notes = @"
          Phantom Installer v1.2.2

          - Fixes the downloaded EXE closing immediately after launch.
          - Bundles the native WPF runtime libraries into the single downloadable EXE.
          - No longer requests administrator rights just to open the application.
          - CI now launches the exact isolated release EXE, not a DLL with build-folder dependencies.
          - Keeps startup crash reporting in %LOCALAPPDATA%\PhantomInstaller\startup.log.
          - Keeps Pro Presets, CFG Builder, hardware optimization, multi-drive CS2 discovery, signatures and custom CFG installation.
          - One standalone PhantomInstaller.exe; no extra folder or .NET installation is required.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main --title "Phantom Installer v1.2.2" --notes $notes
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Phantom Installer v1.2.2" --notes $notes
          }
          gh release upload $tag "release/PhantomInstaller.exe" --repo $env:GITHUB_REPOSITORY --clobber
