// ========================================
// VIEWMODEL   (weapon pushed to the absolute far / right / low corner)
// ========================================
// These four are already at CS2's hard limits:
//   viewmodel_fov      max 68   -> weapon rendered smallest / furthest
//   viewmodel_offset_x max 2.5  -> furthest to the right edge
//   viewmodel_offset_y max 2    -> furthest forward, away from the camera
//   viewmodel_offset_z min -2   -> lowest possible
// The engine clamps anything beyond these, so this is the true maximum.
viewmodel_presetpos 0
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -2
cl_prefer_lefthanded 0


// ========================================
// VISUAL COMFORT   (calmer picture while spraying)
// ========================================
// Crosshair no longer jumps with the recoil pattern.
cl_crosshair_recoil 0

// Keep first-person tracers enabled: they help visually control sprays.
r_drawtracers_firstperson 1

// Gamma: default is 2.2, HIGHER = DARKER. You were on 3 (very dark,
// crushed blacks). 2.4 is slightly darker than stock with clean blacks
// and players still readable in dark corners.
// NOTE: r_fullscreen_gamma only takes effect in exclusive Fullscreen.
// You are currently in Fullscreen Windowed - see RESTORE.txt.
r_fullscreen_gamma 2.4

// Boost Player Contrast - keeps enemies readable on the darker picture.
r_player_visibility_mode 1


